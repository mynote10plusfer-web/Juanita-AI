name: Android APK

on:
  push:
    branches: [ "main", "feature/digital-character-engine-phase-c1", "feature/digital-character-engine-phase-c2-cultural-dossiers", "feature/digital-character-engine-phase-c3-controlled-presence" ]
  pull_request:
    branches: [ "main", "feature/digital-character-engine-phase-c1" ]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  # Keep only the newest validation run for a branch/PR.
  # Phase C1-C3 validate character, cultural dossier approval and controlled-presence policy.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Compile Android instrumentation tests
        run: gradle --no-daemon :app:assembleDebugAndroidTest

      - name: Verify debug APK package identity
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          BADGING="$("$AAPT" dump badging "$APK")"
          grep -F "package: name='ai.juanita.app.debug'" <<< "$BADGING" >/dev/null || {
            echo "::error::Debug APK must use application ID ai.juanita.app.debug."
            exit 1
          }
          echo "Debug package identity verified: ai.juanita.app.debug"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Juanita-AI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  instrumentation:
    name: Run Android instrumentation tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [31]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run instrumentation tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          # These tests use Android framework APIs only; Google Play services are not required.
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          emulator-boot-timeout: 900
          # Start ADB before the runner's boot polling; its launcher calls adb directly.
          pre-emulator-launch-script: adb start-server
          # Avoid the runner's failing post-boot animation/ADB settings command.
          disable-animations: false
          # The action executes each script line separately; keep conditionals on one line.
          script: |
            set -eu
            echo "Waiting for Android emulator transport..."
            timeout 60s adb wait-for-device
            echo "ADB state: $(adb get-state)"
            echo "Boot completed: $(adb shell getprop sys.boot_completed)"
            if gradle --no-daemon :app:connectedDebugAndroidTest; then echo "Android instrumentation tests completed successfully."; else result=$?; echo "Instrumentation failed; collecting emulator diagnostics..."; adb devices -l || true; adb logcat -d -b all -t 1200 || true; exit "$result"; fi
