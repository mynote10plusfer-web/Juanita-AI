name: Android APK

on:
  push:
    branches: [ "main", "feature/digital-character-engine-phase-c1", "feature/digital-character-engine-phase-c2-cultural-dossiers", "feature/digital-character-engine-phase-c3-controlled-presence", "feature/shared-memory-single-active-persona" ]
  pull_request:
    branches: [ "main", "feature/digital-character-engine-phase-c1", "feature/digital-character-engine-phase-c3-controlled-presence" ]
  workflow_dispatch:
    inputs:
      detekt_bootstrap:
        description: "Generate and commit the initial Detekt baseline (run once)"
        required: false
        default: false
        type: boolean

concurrency:
  group: android-build-${{ github.ref }}
  # Keep only the newest validation run for a branch/PR.
  # Phase C1-C3 plus shared-memory/single-active-character invariants are validated.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Run JVM unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Compile Android instrumentation tests
        run: gradle --no-daemon :app:assembleDebugAndroidTest

      # Run only when explicitly requested from Actions. The baseline is committed
      # by the separate least-privilege job below; normal PR runs never regenerate it.
      - name: Generate initial Detekt baseline
        if: github.event_name == 'workflow_dispatch' && inputs.detekt_bootstrap == true
        run: gradle --no-daemon :app:detektBaseline

      - name: Run Detekt Kotlin analysis
        if: (github.event_name == 'workflow_dispatch' && inputs.detekt_bootstrap == true) || hashFiles('config/detekt/baseline.xml') != ''
        run: gradle --no-daemon :app:detekt

      - name: Upload Detekt report and optional bootstrap baseline
        uses: actions/upload-artifact@v4
        with:
          name: Juanita-AI-detekt-report
          path: |
            config/detekt/baseline.xml
            app/build/reports/detekt/**
          if-no-files-found: warn
          retention-days: 7


      - name: Verify debug APK package identity
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          BADGING="$("$AAPT" dump badging "$APK")"
          grep -F "package: name='ai.juanita.app.debug'" <<< "$BADGING" >/dev/null || {
            echo "::error::Debug APK must use application ID ai.juanita.app.debug."
            exit 1
          }
          echo "Debug package identity verified: ai.juanita.app.debug"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Juanita-AI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  instrumentation:
    name: Run Android instrumentation tests (API 31)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # API 31 is the stable CI emulator baseline. API 35 has repeatedly
        # failed at emulator/process startup in this runner and is validated
        # on the physical Android 15 Samsung device instead.
        api-level: [31]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run instrumentation tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          # These tests use Android framework APIs only; Google Play services are not required.
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          emulator-boot-timeout: 300
          # Start ADB before the runner's boot polling; its launcher calls adb directly.
          pre-emulator-launch-script: adb start-server
          # Avoid the runner's failing post-boot animation/ADB settings command.
          disable-animations: false
          # The action executes each script line separately; keep conditionals on one line.
          script: |
            set -eu
            echo "Waiting for Android emulator transport..."
            timeout 60s adb wait-for-device
            echo "ADB state: $(adb get-state)"
            echo "Boot completed: $(adb shell getprop sys.boot_completed)"
            if gradle --no-daemon :app:connectedDebugAndroidTest; then echo "Android instrumentation tests completed successfully."; else result=$?; echo "Instrumentation failed; collecting emulator diagnostics..."; adb devices -l || true; adb logcat -d -b all -t 1200 || true; exit "$result"; fi

  commit-detekt-baseline:
    name: Commit initial Detekt baseline
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.detekt_bootstrap == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download generated baseline
        uses: actions/download-artifact@v4
        with:
          name: Juanita-AI-detekt-report
          path: .

      - name: Commit baseline only
        shell: bash
        run: |
          set -euo pipefail
          test -s config/detekt/baseline.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/detekt/baseline.xml
          if git diff --cached --quiet; then
            echo "Detekt baseline is already up to date."
          else
            git commit -m "build: establish Detekt baseline"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
