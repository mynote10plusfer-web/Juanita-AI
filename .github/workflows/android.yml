name: Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  # Do not cancel emulator/device tests just because another commit is pushed to this PR.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Compile Android instrumentation tests
        run: gradle --no-daemon :app:assembleDebugAndroidTest

      - name: Verify debug APK package identity
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          BADGING="$("$AAPT" dump badging "$APK")"
          grep -F "package: name='ai.juanita.app.debug'" <<< "$BADGING" >/dev/null || {
            echo "::error::Debug APK must use application ID ai.juanita.app.debug."
            exit 1
          }
          echo "Debug package identity verified: ai.juanita.app.debug"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Juanita-AI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  instrumentation:
    name: Run Android instrumentation tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [31, 35]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run instrumentation tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          # These tests use Android framework APIs only; Google Play services are not required.
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          boot-timeout: 900
          # The runner's post-boot settings/ADB call was disconnecting API 35 before tests started.
          # Keep animations enabled rather than turning an emulator transport failure into a false app failure.
          disable-animations: false
          script: |
            set -euo pipefail
            echo "Checking Android emulator transport before Gradle tests..."
            adb wait-for-device
            for attempt in $(seq 1 30); do
              state="$(adb get-state 2>/dev/null || true)"
              boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              if [[ "$state" == "device" && "$boot" == "1" ]]; then
                echo "Emulator is online and boot completed."
                break
              fi
              if [[ "$attempt" == "30" ]]; then
                echo "::error::Android emulator did not remain online after boot."
                adb devices -l || true
                adb logcat -d -t 500 || true
                exit 1
              fi
              sleep 2
            done
            gradle --no-daemon :app:connectedDebugAndroidTest
