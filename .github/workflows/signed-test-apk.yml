name: Signed Test APK (stable updates)

on:
  push:
    branches: [ "integration/unified-rollup-2026-11-18" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-test:
    name: Build permanently signed test APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cumulative integration branch
        uses: actions/checkout@v4

      - name: Require permanent signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.JUANITA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.JUANITA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JUANITA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.JUANITA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Permanent signing secrets are missing. No unsigned/debug APK will be published by this workflow."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore permanent signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.JUANITA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/juanita-test-signing.jks"
          test -s "$RUNNER_TEMP/juanita-test-signing.jks"

      - name: Build test APK with monotonic version
        shell: bash
        env:
          JUANITA_SIGNING_STORE_FILE: ${{ runner.temp }}/juanita-test-signing.jks
          JUANITA_SIGNING_STORE_PASSWORD: ${{ secrets.JUANITA_KEYSTORE_PASSWORD }}
          JUANITA_SIGNING_KEY_ALIAS: ${{ secrets.JUANITA_KEY_ALIAS }}
          JUANITA_SIGNING_KEY_PASSWORD: ${{ secrets.JUANITA_KEY_PASSWORD }}
          JUANITA_TEST_VERSION_CODE: ${{ github.run_number }}
          JUANITA_TEST_VERSION_NAME: 0.11.13-ci${{ github.run_number }}
        run: |
          set -euo pipefail
          export JUANITA_TEST_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          gradle --no-daemon :app:assembleTestRelease
          gradle --no-daemon :app:testDebugUnitTest

      - name: Verify package, version and permanent certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/testRelease/app-testRelease.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)"
          "$APKSIGNER" verify --verbose "$APK"
          CERT_SHA256=$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print toupper($2); exit}')
          EXPECTED_CERT_SHA256="9092CEFDC0DE218921A723810575B029550CEFFA6D82593BE22F5F1F6EBA7BE1"
          if [[ "$CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::Test APK signer does not match the permanent trusted certificate."
            exit 1
          fi
          BADGING=$("$AAPT" dump badging "$APK")
          grep -F "package: name='ai.juanita.app.debug'" <<< "$BADGING" >/dev/null || {
            echo "::error::Expected isolated test package ai.juanita.app.debug."
            exit 1
          }
          VERSION_CODE=$(sed -nE 's/.*versionCode=([0-9]+).*/\1/p' <<< "$BADGING" | head -n1)
          if [[ -z "$VERSION_CODE" || "$VERSION_CODE" -le 100000 ]]; then
            echo "::error::Test APK does not have the expected monotonic versionCode."
            exit 1
          fi
          echo "Verified stable test package, monotonic versionCode and permanent certificate: $CERT_SHA256"

      - name: Upload signed test APK
        uses: actions/upload-artifact@v4
        with:
          name: Juanita-AI-signed-test-update
          path: app/build/outputs/apk/testRelease/app-testRelease.apk
          if-no-files-found: error
          retention-days: 30
