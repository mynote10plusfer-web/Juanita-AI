name: Signed Android Release

on:
  push:
    branches: [ "main", "feature/onboarding-alarm-voice-notifications-preview-0.11.2", "integration/unified-rollup-2026-11-18" ]
  pull_request:
    branches: [ "main" ]
    paths:
      - "app/**"
      - ".github/workflows/release-signed.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: juanita-signed-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build permanently signed release APK
    if: github.event_name != 'pull_request' || github.event.pull_request.number == 58
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check signing configuration
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.JUANITA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.JUANITA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JUANITA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.JUANITA_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "All signing secrets are configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            if [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" && "${GITHUB_EVENT_NUMBER:-}" == "58" ]]; then
              echo "::error::The cumulative production PR requires the permanent signing secrets; refusing to build an unsigned candidate."
              exit 1
            fi
            echo "::warning::Signed release skipped because one or more permanent signing secrets are missing."
          fi

      - name: Set up JDK 17
        if: steps.signing.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.signing.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore permanent signing key
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.JUANITA_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/juanita-release.jks"
          test -s "$RUNNER_TEMP/juanita-release.jks"

      - name: Build signed release APK
        if: steps.signing.outputs.ready == 'true'
        env:
          JUANITA_SIGNING_STORE_FILE: ${{ runner.temp }}/juanita-release.jks
          JUANITA_SIGNING_STORE_PASSWORD: ${{ secrets.JUANITA_KEYSTORE_PASSWORD }}
          JUANITA_SIGNING_KEY_ALIAS: ${{ secrets.JUANITA_KEY_ALIAS }}
          JUANITA_SIGNING_KEY_PASSWORD: ${{ secrets.JUANITA_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK signature, production package and update version
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$APKSIGNER" verify --verbose "$APK"
          CERT_SHA256=$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print toupper($2); exit}')
          EXPECTED_CERT_SHA256="9092CEFDC0DE218921A723810575B029550CEFFA6D82593BE22F5F1F6EBA7BE1"
          if [[ -z "$CERT_SHA256" || "$CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::Release certificate mismatch. Refusing to publish an APK that cannot update the known-good installation."
            echo "Expected permanent signer SHA-256: $EXPECTED_CERT_SHA256"
            echo "Actual signer SHA-256: ${CERT_SHA256:-missing}"
            exit 1
          fi
          echo "Permanent signing certificate matches the known-good release."
          BADGING=$("$AAPT" dump badging "$APK")
          grep -F "package: name='ai.juanita.app' " <<< "$BADGING" >/dev/null || {
            echo "::error::APK package must be exactly ai.juanita.app."
            exit 1
          }
          APK_VERSION_CODE=$(sed -nE "s/.*versionCode='([0-9]+)'.*/\\1/p" <<< "$BADGING" | head -n1)
          APK_VERSION_NAME=$(sed -nE "s/.*versionName='([^']+)'.*/\\1/p" <<< "$BADGING" | head -n1)
          if [[ -z "$APK_VERSION_CODE" || -z "$APK_VERSION_NAME" ]] || (( APK_VERSION_CODE <= 53 )); then
            echo "::error::APK metadata is missing or versionCode is not greater than the current candidate baseline (53)."
            echo "Actual package metadata: ${BADGING}"
            exit 1
          fi
          echo "Verified update-compatible production APK: ai.juanita.app versionCode=$APK_VERSION_CODE versionName=$APK_VERSION_NAME."
      - name: Upload signed APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Juanita-AI-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
