name: Signed Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build permanently signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.JUANITA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.JUANITA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JUANITA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.JUANITA_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing JUANITA_KEYSTORE_BASE64" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing JUANITA_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing JUANITA_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing JUANITA_KEY_PASSWORD" && exit 1)

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.JUANITA_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/juanita-release.jks"
          test -s "$RUNNER_TEMP/juanita-release.jks"

      - name: Build signed release APK
        env:
          JUANITA_SIGNING_STORE_FILE: ${{ runner.temp }}/juanita-release.jks
          JUANITA_SIGNING_STORE_PASSWORD: ${{ secrets.JUANITA_KEYSTORE_PASSWORD }}
          JUANITA_SIGNING_KEY_ALIAS: ${{ secrets.JUANITA_KEY_ALIAS }}
          JUANITA_SIGNING_KEY_PASSWORD: ${{ secrets.JUANITA_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Juanita-AI-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
