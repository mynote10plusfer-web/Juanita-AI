name: Signed Android Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build permanently signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check signing configuration
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.JUANITA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.JUANITA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JUANITA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.JUANITA_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "All signing secrets are configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signed release skipped: one or more JUANITA signing secrets are missing. The Android APK workflow still builds a debug APK, but it cannot update an installed release."
          fi

      - name: Set up JDK 17
        if: steps.signing.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.signing.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore permanent signing key
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.JUANITA_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/juanita-release.jks"
          test -s "$RUNNER_TEMP/juanita-release.jks"

      - name: Build signed release APK
        if: steps.signing.outputs.ready == 'true'
        env:
          JUANITA_SIGNING_STORE_FILE: ${{ runner.temp }}/juanita-release.jks
          JUANITA_SIGNING_STORE_PASSWORD: ${{ secrets.JUANITA_KEYSTORE_PASSWORD }}
          JUANITA_SIGNING_KEY_ALIAS: ${{ secrets.JUANITA_KEY_ALIAS }}
          JUANITA_SIGNING_KEY_PASSWORD: ${{ secrets.JUANITA_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK signature
        if: steps.signing.outputs.ready == 'true'
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Juanita-AI-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
