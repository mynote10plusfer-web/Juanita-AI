name: Signed Android Release

on:
  push:
    branches: [ "main", "feature/onboarding-alarm-voice-notifications-preview-0.11.2" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build permanently signed release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check signing configuration
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.JUANITA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.JUANITA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JUANITA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.JUANITA_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "All signing secrets are configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signed release skipped: one or more JUANITA signing secrets are missing. The Android APK workflow still builds a debug APK, but it cannot update an installed release."
          fi

      - name: Set up JDK 17
        if: steps.signing.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.signing.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore permanent signing key
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.JUANITA_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/juanita-release.jks"
          test -s "$RUNNER_TEMP/juanita-release.jks"

      - name: Build signed release APK
        if: steps.signing.outputs.ready == 'true'
        env:
          JUANITA_SIGNING_STORE_FILE: ${{ runner.temp }}/juanita-release.jks
          JUANITA_SIGNING_STORE_PASSWORD: ${{ secrets.JUANITA_KEYSTORE_PASSWORD }}
          JUANITA_SIGNING_KEY_ALIAS: ${{ secrets.JUANITA_KEY_ALIAS }}
          JUANITA_SIGNING_KEY_PASSWORD: ${{ secrets.JUANITA_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK signature and permanent certificate
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose "$APK"
          CERT_SHA256=$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print toupper($2); exit}')
          EXPECTED_CERT_SHA256="9092CEFDC0DE218921A723810575B029550CEFFA6D82593BE22F5F1F6EBA7BE1"
          if [[ -z "$CERT_SHA256" || "$CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]]; then
            echo "::error::Release certificate mismatch. Refusing to publish an APK that cannot update the known-good installation."
            echo "Expected permanent signer SHA-256: $EXPECTED_CERT_SHA256"
            echo "Actual signer SHA-256: ${CERT_SHA256:-missing}"
            exit 1
          fi
          echo "Permanent signing certificate matches the known-good release."
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")
          EXPECTED_APPLICATION_ID=$(sed -nE 's/^[[:space:]]*applicationId = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)
          EXPECTED_VERSION_CODE=$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -n1)
          EXPECTED_VERSION_NAME=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)
          if [[ -z "$EXPECTED_APPLICATION_ID" || -z "$EXPECTED_VERSION_CODE" || -z "$EXPECTED_VERSION_NAME" ]]; then
            echo "::error::Could not read application ID/version metadata from app/build.gradle.kts."
            exit 1
          fi
          if (( EXPECTED_VERSION_CODE <= 32 )); then
            echo "::error::Update versionCode must be greater than the previous production release (32)."
            exit 1
          fi
          grep -F "package: name='$EXPECTED_APPLICATION_ID' versionCode='$EXPECTED_VERSION_CODE' versionName='$EXPECTED_VERSION_NAME'" <<< "$BADGING" >/dev/null || {
            echo "::error::APK metadata does not match Gradle configuration."
            exit 1
          }
          echo "Application ID and monotonically increasing update version verified: $EXPECTED_APPLICATION_ID / $EXPECTED_VERSION_NAME ($EXPECTED_VERSION_CODE)."

      - name: Upload signed APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Juanita-AI-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
