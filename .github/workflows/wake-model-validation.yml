name: Offline wake model validation

on:
  push:
    branches: ["integration/unified-rollup-2026-11-18"]
    paths:
      - ".github/workflows/wake-model-validation.yml"
      - "docs/WAKE_WORD_RUNTIME_DESIGN.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wake-model-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch-and-validate-spanish-kws:
    name: Fetch pinned Spanish KWS model and validate Hola Juanita tokens
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install canonical SentencePiece tokenizer
        run: python -m pip install --disable-pip-version-check sentencepiece==0.2.1

      - name: Download immutable model revision
        shell: bash
        run: |
          set -euo pipefail
          MODEL_ID="jguerrisi/sherpa-onnx-kws-zipformer-es-3M-2026-08-08"
          REVISION="d4fa6bd"
          BASE="https://huggingface.co/${MODEL_ID}/resolve/${REVISION}"
          mkdir -p wake-model
          files=(
            "encoder-epoch-20-avg-2-chunk-16-left-64.onnx"
            "decoder-epoch-20-avg-2-chunk-16-left-64.onnx"
            "joiner-epoch-20-avg-2-chunk-16-left-64.onnx"
            "tokens.txt"
            "bpe.model"
          )
          for file in "${files[@]}"; do
            echo "Downloading ${file}"
            curl --fail --location --retry 3 --retry-all-errors \
              --connect-timeout 20 --max-time 600 \
              "${BASE}/${file}" -o "wake-model/${file}"
            test -s "wake-model/${file}"
          done
          printf '%s\n' "${MODEL_ID}" > wake-model/model-id.txt
          printf '%s\n' "${REVISION}" > wake-model/model-revision.txt
          echo "21661e7892f33bd7495bea5f319f6edf45eed681c1f5afbc0a275b5d30625838  wake-model/bpe.model" | sha256sum --check -

      - name: Generate BPE keyword file and integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import sentencepiece as spm

          root = Path("wake-model")
          phrase = "Hola Juanita"
          normalized = phrase.casefold()
          processor = spm.SentencePieceProcessor(model_file=str(root / "bpe.model"))
          pieces = processor.encode(normalized, out_type=str)
          if not pieces or any(piece == "<unk>" for piece in pieces):
              raise SystemExit("Selected wake phrase is not covered by the pinned SentencePiece vocabulary")
          tokens = (root / "tokens.txt").read_text(encoding="utf-8").splitlines()
          vocabulary = {line.split()[0] for line in tokens if line.strip()}
          missing = [piece for piece in pieces if piece not in vocabulary]
          if missing:
              raise SystemExit("BPE pieces absent from sherpa tokens.txt: " + repr(missing))

          tag = normalized.replace(" ", "_")
          keyword_line = f"{' '.join(pieces)} :1.0 #0.20 @{tag}\n"
          (root / "keywords.txt").write_text(keyword_line, encoding="utf-8")
          (root / "keywords.phrase").write_text(phrase + "\n", encoding="utf-8")

          files = {}
          for path in sorted(root.iterdir()):
              if path.is_file() and path.name != "integrity.json":
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  files[path.name] = {"sha256": digest, "bytes": path.stat().st_size}
          manifest = {
              "model_id": "jguerrisi/sherpa-onnx-kws-zipformer-es-3M-2026-08-08",
              "revision": "d4fa6bd",
              "license": "Apache-2.0",
              "sample_rate_hz": 16000,
              "feature_dim": 80,
              "phrase": phrase,
              "normalized_phrase": normalized,
              "bpe_pieces": pieces,
              "keyword_line": keyword_line.rstrip("\n"),
              "files": files,
          }
          (root / "integrity.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload verified model bundle
        uses: actions/upload-artifact@v4
        with:
          name: Juanita-WakeModel-validation
          path: wake-model/
          if-no-files-found: error
          retention-days: 14
